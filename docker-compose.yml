services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: marcos
      POSTGRES_PASSWORD: marcos123
      POSTGRES_DB: pyme_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: